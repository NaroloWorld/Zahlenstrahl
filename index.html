<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Zahlenstrahl – Start</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="start-page">

    <header>
        <h1>Zahlenstrahl</h1>
    </header>

    <main>
        <section class="range-selection">
            <h2>Wähle einen Zahlenraum</h2>

            <div class="grid">
                <!-- Natürliche Zahlen -->
                <button class="range-btn" data-min="0" data-max="10">0 bis 10</button>
                <button class="range-btn" data-min="0" data-max="100">0 bis 100</button>
                <button class="range-btn" data-min="0" data-max="1000">0 bis 1'000</button>

                <!-- Mit negativen Zahlen -->
                <button class="range-btn" data-min="-10" data-max="10">-10 bis 10</button>
                <button class="range-btn" data-min="-100" data-max="100">-100 bis 100</button>
                <button class="range-btn" data-min="-1000000" data-max="1000000">-1'000'000 bis 1'000'000</button>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
